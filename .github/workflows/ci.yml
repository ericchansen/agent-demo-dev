name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src/

      - name: Unit tests
        run: pytest tests/unit/

      - name: MCP wire protocol and real-client tests
        run: pytest tests/integration/test_mcp_servers.py

      - name: Golden QA eval
        run: python tests/eval/run_eval.py --mock --pass-rate 100

      - name: Demo readiness
        run: python scripts/demo_check.py

      - name: Recorded backend E2E proof
        run: python scripts/recorded_live_proof.py

      - name: Workshop visual proof
        run: python scripts/check_workshop_visuals.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

  canonical-lock-candidate:
    if: github.event_name == 'pull_request' && github.head_ref == 'erichansen-microsoft-mcp-2-migration' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
      UV_HTTP_TIMEOUT: "20"
      UV_HTTP_RETRIES: "0"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install official resolver
        run: python -m pip install --index-url https://pypi.org/simple uv==0.11.0

      - name: Generate canonical candidate without changing committed lock
        run: |
          set -euo pipefail
          mkdir -p lock-candidate
          cp uv.lock lock-candidate/before.lock
          uv --version | tee lock-candidate/resolver-version.txt
          uv lock \
            --upgrade-package mcp==2.2.0 \
            --upgrade-package databricks-mcp==0.9.2 \
            --upgrade-package agent-framework-core==1.9.0 \
            --upgrade-package agent-framework-orchestrations==1.0.0 \
            2>&1 | tee lock-candidate/resolver.log
          cp uv.lock lock-candidate/uv.lock
          uv lock --check --offline 2>&1 | tee lock-candidate/consistency.log

      - name: Audit candidate provenance and dependency delta
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import tomllib

          root = Path("lock-candidate")
          before = tomllib.loads((root / "before.lock").read_text())
          after = tomllib.loads((root / "uv.lock").read_text())

          def versions(lock):
              result = {}
              for package in lock["package"]:
                  result.setdefault(package["name"], set()).add(package["version"])
              return {name: sorted(values) for name, values in result.items()}

          old = versions(before)
          new = versions(after)
          delta = {
              name: {"before": old.get(name, []), "after": new.get(name, [])}
              for name in sorted(old.keys() | new.keys())
              if old.get(name) != new.get(name)
          }
          registries = sorted({
              package["source"]["registry"]
              for package in after["package"]
              if "registry" in package.get("source", {})
          })
          evidence = {
              "head_sha": os.environ["PR_HEAD_SHA"],
              "manifest_sha256": hashlib.sha256(Path("pyproject.toml").read_bytes()).hexdigest(),
              "input_lock_sha256": hashlib.sha256((root / "before.lock").read_bytes()).hexdigest(),
              "output_lock_sha256": hashlib.sha256((root / "uv.lock").read_bytes()).hexdigest(),
              "registries": registries,
              "dependency_delta": delta,
          }
          (root / "provenance.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          expected = {
              "mcp": "2.2.0",
              "mcp-types": "2.2.0",
              "databricks-mcp": "0.9.2",
              "agent-framework-core": "1.9.0",
              "agent-framework-orchestrations": "1.0.0",
              "agent-framework-foundry": "1.8.1",
              "agent-framework-openai": "1.8.1",
              "mlflow": "3.13.0",
              "cryptography": "48.0.0",
          }
          assert registries == ["https://pypi.org/simple"], registries
          for name, version in expected.items():
              assert new.get(name) == [version], (name, new.get(name))
          allowed_updates = {"mcp", "databricks-mcp", "agent-framework-core"}
          unexpected = {name: value for name, value in delta.items() if name in old and name not in allowed_updates}
          assert not unexpected, unexpected
          PY

      - name: Preserve candidate and diagnostic evidence for review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canonical-lock-${{ github.event.pull_request.head.sha }}
          path: lock-candidate/
          if-no-files-found: error
          retention-days: 3

  locked-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lock tooling
        run: python -m pip install uv==0.11.0

      - name: Install exact core and optional runtime lock
        run: |
          uv sync --locked --extra dev --extra agent-framework --extra databricks-mcp
          uv pip check

      - name: Locked source types and protocol tests
        run: |
          uv run --no-sync mypy src/
          uv run --no-sync pytest tests/ tests/optional/agent_framework_smoke.py tests/optional/databricks_mcp_smoke.py

      - name: Locked local startup and readiness
        run: uv run --no-sync python scripts/demo_check.py

  optional-agent-framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install fresh optional runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agent-framework]"
          pip check

      - name: Construct real Foundry client and workflows offline
        run: pytest tests/optional/agent_framework_smoke.py

  validate-bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep

  hosted-agent-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build hosted agent image
        run: docker build -f src/orchestrator/hosted_agent/Dockerfile -t wwi-hosted-agent:ci .

      - name: Probe hosted agent health endpoints
        run: |
          set -euo pipefail
          container_id="$(docker run -d -p 8080:8088 wwi-hosted-agent:ci)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/healthz >/tmp/healthz.json; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:8080/healthz | tee /tmp/healthz.json
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz | tee /tmp/readyz.json
          curl --fail --silent --show-error http://127.0.0.1:8080/readiness | tee /tmp/readiness.json
